name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'calendari-dinars-2026.ics'
      - 'data/**'
      - 'scripts/**'
      - 'nginx.conf'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tagging.outputs.new_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing tags
        id: tags
        run: |
          if git tag -l 'v*' | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version (initial)
        if: steps.tags.outputs.exists == 'false'
        id: tag_initial
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: 1.0.0

      - name: Bump version (auto)
        if: steps.tags.outputs.exists == 'true'
        id: tag_auto
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Set output
        id: tagging
        run: |
          echo "new_tag=${{ steps.tag_initial.outputs.new_tag || steps.tag_auto.outputs.new_tag }}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.new_tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-k8s:
    needs: [version, build-and-push]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update k8s manifest with new tag
        env:
          NEW_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f k8s/application.yaml ]; then
            sed -i "s|tag: .*|tag: ${NEW_TAG#v}|" k8s/application.yaml
            git add k8s/application.yaml
            git commit -m "chore: update k8s tag to ${NEW_TAG#v} [skip ci]" || true
            git pull --rebase origin main
            git push
          fi
